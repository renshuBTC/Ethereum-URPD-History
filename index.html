dd("dragging"),document.body.classList.add("tracer-dragging");var o=t.layout&&t.layout.xaxis2&&t.layout.xaxis2.range;window.tracerDragWindow=o?[new Date(String(o[0]).slice(0,10)+"T00:00:00Z").getTime(),new Date(String(o[1]).slice(0,10)+"T00:00:00Z").getTime()]:null}})),e.addEventListener("pointermove",(function(e){if(s){e.preventDefault();var o=function(e){var s=a();if(!s)return-1;var o=s.xaxis2,n=t.getBoundingClientRect(),i=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fit"))||1,r=Math.max(0,Math.min(o._length,(e-n.left)/i-o._offset)),h=String(o.p2d(r)).slice(0,10);return/^\d{4}-\d{2}-\d{2}$/.test(h)?function(e){for(var t=0,a=allDates.length-1;t<a;){var s=t+a>>1;allDates[s]<e?t=s+1:a=s}if(t>0){var o=new Date(e+"T00:00:00Z").getTime();Math.abs(new Date(allDates[t-1]+"T00:00:00Z").getTime()-o)<Math.abs(new Date(allDates[t]+"T00:00:00Z").getTime()-o)&&t--}return t}(h):-1}(e.clientX);o>=0&&o<allDates.length&&goTo(o)}})),e.addEventListener("pointerup",o),e.addEventListener("pointercancel",o),window.addEventListener("pointerup",o),window.addEventListener("pointercancel",o),e.addEventListener("dblclick",(function(e){e.preventDefault()}))}();var EXPLAINER={en:{title:"How to read this chart",sections:[["Start here","Ask every ether in existence one question: what was ETH worth the last time you moved? Sort the answers into price buckets and add up the supply in each. That is this chart. A tall bar is a price where a lot of supply last changed hands. A gap is a price where almost none did. The formal name for it is URPD, the Realised Price Distribution."],["Accounts, and lots","Ethereum keeps balances in accounts, not as separate coins. To give every ETH a price, each account's balance is treated as a stack of lots: every rise in its balance is a lot, stamped with the block it arrived in, and so with the moment it arrived (several rises in one block are one lot), and every fall spends the oldest lots first, first in, first out. The unspent rest of a lot keeps its stamp: that ETH did not move. Every bar on this chart is built out of these lots, rebuilt from every balance change since the first block."],["Why every coin carries a price","A lot is stamped with the moment its ETH arrived, and that moment had a price. Coin Metrics, the source of the prices here, gives one price a day, the close, so within each day the price is taken to run in a straight line from the day's open (the close the day before) to its close, and every ETH alive today carries the price on that line at the moment it last moved. That attached price is its realised price, also called its cost basis, the closest thing on-chain to what the current holder paid. The genesis allocation (about 72 million ETH, from the 2014 presale and the early contributors' share) carries $0, as there was no market price on day one, and so does ETH that last moved before 8 August 2015, the first day with a daily close; ETH that last moved on that day carries its close."],["Reading the axes","Along the bottom is that attached price in dollars, not today's price. Up the left is each price bucket's share of the day, in percent: of the realized cap (every coin's value when it last moved, added up) in % USD mode, of all the coins in % ETH mode. The bars add up to 100% on every day, so the same height is the same share on any day. Both axes are marked at twenty equal steps from zero to their very end, with the labels rounded to two significant figures. The price axis is not refitted to each day: it ends at the highest price the data had reached by the day you are viewing, grows only when the data goes past it, and never shrinks. The left axis ends at the day's own tallest bar, so every day's distribution fills the same frame; the Y-max field and PIN Y-AXIS are the only things that change that (see Y-max and Pin Y-axis). In % ETH mode Y-max starts at 99.8: the first bar holds every coin last moved for less than one bar's width, the unmoved part of the genesis allocation at $0 among them, and is usually the tallest bar, so at 99.8 the tallest bar runs off the top with its height printed there (▲). Type 100 to see it whole."],["The colours: how old the coins are","With AGE on, every bar is stacked out of 23 age bands, set by how long the coin has sat unmoved: under an hour at one end, over fifteen years at the other. Yellow is fresh, deep blue is ancient, and the steps between are logarithmic, so equal colour distance is equal multiples of age. The colours follow one path through a perceptual colour space (OKLCH), spaced so that every step looks the same size, with brightness falling steadily from young to old, so the order still reads in greyscale, and every band keeps at least 3:1 contrast against the dark background. A tall bar in one colour is a single cohort. A tall bar in many colours is a price that generations of holders share."],["LTH/STH or AGE","The second pair of switches picks how the bars are coloured. LTH/STH, the default, splits every coin by its own age at Ethereum's long-term holder boundary, %B% days. The boundary is worked out from Ethereum's own history with Glassnode's method: for every age, the chance that a lot of that age is spent within the next 7, 14, 30, 60, 90 or 120 days. That chance falls as coins age, steeply at first, then levels off; the boundary is the last age within the first year at which it still falls faster than it ever does for coins over a year old (the median of the six windows). Rather than a hard cut, a coin counts as long-term held in a share that rises smoothly around the boundary, Glassnode's logistic weight, 10 days wide: half at %B% days unmoved, 90% about 22 days later. Short-term holders (STH), in amber, and long-term holders (LTH), in blue, together are the whole supply. AGE stacks each bar out of the 23 age bands themselves. The bars, the axes and a pinned Y-axis are the same either way; only the colours change.","w(a) = 1 / (1 + e^(−(a − %B%) / 10))   (a = days unmoved)\nLTH = Σ w(a) · amount,   STH = Σ (1 − w(a)) · amount"],["The white line: ETH's price","ETH's own price, as daily closes. It has its own hidden axes: left to right is time here rather than price, a year running from 275 days before the selected day to 90 days after it (near the latest day it ends a week past that day and starts further back instead), and the height runs linearly from $0 to the highest close shown so far, so the line fills the chart and the same dollar move is always the same height. That scale grows only when the price makes a new high. The orange dot sits on the selected day and past cycle tops and bottoms are marked. Drag the dot to move through history. Click ETH/USD in the legend to hide the line."],["Hovering a bar","Hover over a bar to read its price, what its age band (or holder group, in LTH/STH) holds there, the whole bar's share with the amount behind it (Total Value When Last Moved, or Total Supply in % ETH mode) and Percent of Total. That last one is a running share: of all the day's supply, or value in % USD mode, the part that last moved at or below this price. It is counted from the recorded prices themselves, not the smoothed bars, so at the dashed line it meets the box's In Profit share. Where it climbs quickly from bar to bar, supply is dense.","Percent of Total(P) = Σ W(p ≤ P) / Σ W × 100"],["Marking a price range","Click and drag across the chart to mark a range of prices. The columns you pass over stay marked between two thin white lines as you move through the days and switch modes, until you double-click the chart or press Escape. A box inside the top of the mark, as wide as the mark, gives the share of the day that last moved inside it (a mark too narrow for the words shows the share alone), of the value in % USD mode and of the coins in % ETH mode, counted from the recorded prices like Percent of Total, and breaks that share down as the bars are coloured, each part of the whole day like the share itself, so the parts add up to it: in AGE by age band, in each band's colour; in LTH/STH between long- and short-term holders. A tall box drops to shorter lines, then to the range and its share alone. In LTH/STH it also gives the most days until every coin there is past the boundary (at least half long-term held), and the date that falls on: %B% days after the youngest of them last moved, every coin's age being known to the day. It reads All Past the LTH Boundary when every coin there is past it.","Share(a, b) = Σ W(a ≤ P < b) / Σ W × 100\nAll past the boundary within = %B% − age of the youngest coin in [a, b)"],["The dashed line: the day's price","The spot price on the selected day. Supply to its left last moved below this price, so it is in profit; supply to its right last moved above it, so it is in loss. The box gives the price and both shares. Profit and loss are counted from the price when last moved, which is what someone paid only if that move was a purchase (see What this chart cannot tell you).","Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"],["What people look for","A thick cluster of bars marks a price where a lot of supply settled. Above today's price such a cluster is often read as overhead resistance, on the reasoning that holders who last moved coins there may sell near break-even. Below today's price the same cluster is read as support. A wide gap is a stretch with little supply to slow a move through it. Treat all of it as a map of where supply sits, not a forecast of where price goes."],["What this chart cannot tell you","ETH moving on-chain is not always a sale. Exchanges move it between their own accounts, people move it between their own wallets, and contracts pass it along (a swap, a bridge, a deposit), and each of those restamps it at that moment's price with no buyer and no seller. ETH staked on the beacon chain is counted once, like any other balance: a deposit keeps the price of the moment it was made, withdrawals take the oldest staked ETH first and arrive as new lots on the day they are paid, and the beacon chain's rewards are new lots on the day they are earned (the amount that brings the staked ETH up to that day's supply, from Coin Metrics). So every day's bars add up to ETH's supply. A trade matched inside an exchange never touches the chain, so both sides keep their old stamp, and ETH whose keys are lost keeps its stamp forever. Read a bar as supply that last moved here, not as proof that someone paid this."],["Moving through time","This chart steps through the whole history, day by day, back to Ethereum's launch on 30 July 2015. 1D/1W/1M/1Y sets the step size and the arrow buttons move one step; Left and Right or A and D do the same from the keyboard. 1 to 4 pick the step size, and Up and Down or W and S move it one size up or down (1D, 1W, 1M, 1Y, and round again); Home and End jump to the first and last day. You can also pick a cycle top or bottom from CYCLE TOP/BTM, by daily close: each top a record close, each past one followed by a fall of 70% or more, and the last the highest close so far; each bottom the lowest close before the next record. Wherever you go, the left axis ends at that day's own bars (see Y-max), unless you have pinned it (see Pin Y-axis). If the keys stop responding, click the chart once to take focus off a toolbar field."],["% USD and % ETH","% ETH counts each coin by how much ether it is. % USD counts it by what it was worth in dollars at the moment it last moved, so 1 ETH last moved at 4,000 dollars outweighs 1 ETH last moved at 40. % ETH shows where the coins are; % USD shows where the money went in. Either way each bar is drawn as its share of the day: of all the coins in % ETH, of the realized cap in % USD. The bars add up to 100% on every day, so the left axis means the same on any day, and the hover gives the amount behind each share.","S(P) = Σ lot.amount where lot.price ∈ [P, P + ΔP)\nValue When Last Moved(P) = P · S(P)\nShare(P) = W(P) / Σ W × 100   (W = S in % ETH, P · S in % USD)"],["Pin Y-axis","The left axis follows each day's own bars, so it changes as you move. PIN Y-AXIS freezes it where it is on the day you are viewing, marked with a dashed line, so every other day is drawn against that one height, the same share of the day on any date, and taller bars run off the top (▲) instead of moving the axis. While it is pinned the Y-max field is off, since the pin decides where the axis ends. Press it again to release. Pins are kept separately for each weighting, bin count and smoothing (AGE and LTH/STH share them, since their bars are the same), because a height only means the same thing under the same settings, and they survive a reload."],["Bins","BINS sets how many equal-width bars the price axis is cut into, from 50 to 1000; 625 by default, the same as the videos. They run from zero to the end of the price axis, 0.1% past the highest daily close so far (see Reading the axes), with one more past it that takes in what the smoothing spreads beyond it (anything reaching further is folded back in, so no supply is lost). With 625, a bar is exactly 1/625 of the price axis, whatever the smoothing. The BINS field shows that width after the count, in dollars for the day in view. Fewer bins give wider bars that each hold more; more give finer detail. Bar widths change only when the axis grows or you change BINS. Bars are drawn on whole pixels with a one-pixel gap so neighbours stay distinct, and are drawn solid once they would be thinner than two pixels.","ΔP = price-axis end / bins   (end = 1.001 × highest close so far)"],["Smoothing","Every coin carries the price at the moment it last moved, on its day's straight line from open to close (see Why every coin carries a price). The rebuild records when in its day each coin moved, to the 45 minutes, and each day is cut into as few parts as keep ETH's move within each part to 0.5% of the price, up to 32; the coins of each part are spread evenly over the prices that part of the day ran through. Smoothing then blurs them with a bell curve, the Gaussian, the one blur that never invents a peak or a gap. Its width is a percentage of the price, 0.24 by default as the videos draw it, and never less than about four tenths of a bar, and each bar receives exactly its share. 0 gives the raw buckets, the coins of each part of a day shared among the bars its prices cover. Total supply and total value are preserved exactly.","σ = √((S% × price)² + ΔP²/6)   (S = 0: raw)\nbar = the part of N(price, σ) inside the bar"],["Y-max","Where the left axis ends, as a percentile of the day's bar heights: at 100 the day's tallest bar reaches the top; below 100 the axis ends at that percentile, and the bars above it run off the top. The ▲ figure at the top left gives the tallest of them and, in brackets, how many more there are, so no bar is ever cut without you seeing it. It starts at 100 in % USD mode and at 99.8 in % ETH mode, where the first bar, usually the tallest, would otherwise set the scale (see Reading the axes); each mode keeps the value you type. While the Y-axis is pinned the field is off.","y-max = percentileₙ(this day's bars)   (100 = the tallest bar)"],["Bottom signal","When the share of the day in loss reaches the threshold set in the toolbar, the dashed line and the border of the price box turn yellow, and the box adds a fourth line naming the threshold. In % USD mode the share is of the value that last moved above the day's price, 90 percent by default; in % ETH mode it is of the coins, 70 percent by default. Each mode keeps the value you type. It describes the day; it is not a forecast.","Signal when In Loss % ≥ Threshold"],["Watch the videos","FULL HISTORY VIDEOS in the toolbar opens a menu of the four, VIDEO (% USD-LTH/STH), VIDEO (% USD-AGE), VIDEO (% ETH-LTH/STH) and VIDEO (% ETH-AGE), each of which opens the whole history as one video on YouTube, drawn as this page draws that choice by default, the bottom signal included, the bars coloured by short- and long-term holders (LTH/STH) or by age band (AGE): 5 minutes at 60 frames a second in 4K (3840 × 2160), with neighbouring days blended so they run smoothly. They are drawn once, up to the day they were made; for the days since, step through them here. Until YouTube lets others watch a video, its entry in the menu opens the channel instead. This site offers no file to download (the camera icon on the chart only saves a PNG picture of it, made in your own browser), and never asks you to install anything, connect a wallet or type a seed phrase. Anything that does is not this site."],["Where the data comes from","Balances come from ethPandaOps Xatu's free public data (every balance change, block and trace since the first block, and the beacon chain's withdrawals), rebuilt block by block and checked as it goes: every change must start from the balance rebuilt so far, to the wei, and the sum of all balances must equal what was issued less what was burned and destroyed. Where that data has gaps, a public Ethereum node fills them. Prices are Coin Metrics' daily closes, joined by a straight line through each day, and Coin Metrics' supply sizes the beacon chain's rewards (see What this chart cannot tell you)."]]},zh:{title:"如何看懂这张图",sections:[["先看这里","向现存的每一枚以太币问同一个问题：你上一次移动时，ETH 值多少钱？把答案按价格区间归类，再把各区间的供应量加总，就得到这张图。柱子越高，说明有越多供应最后一次易手发生在那个价位；出现空档，说明几乎没有。它的正式名称是 URPD，即已实现价格分布。"],["账户与批次","以太坊把余额记在账户里，而不是一枚枚分开的币。为了给每一枚 ETH 一个价格，这里把每个账户的余额看作一叠批次：余额每增加一次就是一个批次，打上它到账的那个区块、也就是到账时刻的标记（同一区块内的多次增加算作一个批次）；余额每减少一次，都先花掉最早的批次，即先进先出。批次中未花掉的剩余部分保留原来的标记：那部分 ETH 没有移动。这张图里的每一根柱子都由这些批次堆成，它们由第一个区块以来的每一次余额变化重建而来。"],["为什么每枚币都带着一个价格","每个批次都标着它的 ETH 到账的时刻，而那一刻有一个价格。这里的价格来源 Coin Metrics 每天只给出一个价格，即收盘价，所以在每一天之内，价格被视为从当天的开盘价（前一天的收盘价）沿一条直线走到当天的收盘价，今天存在的每一枚 ETH 都带着它最后一次移动那一刻在这条直线上的价格。这个价格就是它的已实现价格，也叫成本基础，是链上最接近“当前持有者付出了多少”的量。创世分配（约 7,200 万 ETH，来自 2014 年的预售和早期贡献者的份额）记为 0 美元，因为第一天还没有市场价格；最后一次移动早于 2015 年 8 月 8 日（第一个有日收盘价的日子）的 ETH 也记为 0 美元；在那一天最后移动的 ETH 取当天的收盘价。"],["坐标轴怎么读","横轴是上面那个贴在币上的价格（美元），不是今天的价格。纵轴是每个价格区间占当天总量的百分比：% USD 模式下占已实现市值（每枚币最后移动时的价值之和），% ETH 模式下占全部币数。每一天的柱子加起来都是 100%，所以同样的高度在任何一天都代表同样的占比。两条轴都从零到末端分成二十等份标注，标签取两位有效数字。价格轴不会按每一天重新缩放：它停在截至所看那天、数据到达过的最高价格；只有数据越过时才会扩大，而且永远不会缩小。左轴停在当天自己最高的柱子，所以每一天的分布都填满同一个画框；能改变这一点的只有“Y 轴上限”输入框和“固定 Y 轴”按钮（见“Y 轴上限”与“固定 Y 轴”）。% ETH 模式下 Y 轴上限默认为 99.8：第一根柱子装着所有最后移动价格低于一根柱宽的币，其中包括创世分配中至今未动、记为 0 美元的部分，通常是最高的一根，因此在 99.8 时最高的那根柱子会冲出顶部，并在顶端以 ▲ 标出它的高度。输入 100 即可看到它的全貌。"],["颜色：币有多老","选择“年龄”时，每根柱子由 23 个币龄分层堆成，依据是这枚币静止了多久，一端不到一小时，另一端超过十五年。黄色最新，深蓝最老，中间按对数分级，所以相同的颜色距离对应相同的年龄倍数。颜色沿感知均匀色彩空间（OKLCH）中的一条路径排列，每一级看起来一样大，亮度从新到旧稳定下降，因此在灰度下也能读出顺序；每个分层与深色背景的对比度都不低于 3:1。整根柱子只有一种颜色，说明是单一群体；颜色斑驳，说明这个价位上聚集着好几代持有者。"],["长/短期或年龄","第二组切换决定柱子如何着色。默认的“长/短期”按以太坊自己的长期持有者分界 %B% 天，把每一枚币按它自己的币龄拆分。这个分界用 Glassnode 的方法从以太坊自身的历史中求出：对每一个币龄，计算该币龄的批次在之后 7、14、30、60、90 或 120 天内被花掉的概率。这个概率随币龄增加而下降，起初陡峭，随后趋于平缓；分界就是第一年内这个概率仍比一年以上的币下降得更快的最后一个币龄（取六个窗口的中位数）。它不是一刀切：一枚币算作长期持有的份额在分界附近平滑上升，即 Glassnode 宽度为 10 天的逻辑斯蒂权重：静止满 %B% 天时一半，再过约 22 天时 90%。琥珀色的短期持有者（STH）与蓝色的长期持有者（LTH）合起来就是全部供应。“年龄”则按这 23 个币龄分层堆叠每根柱子。无论选哪种，柱子、坐标轴和已固定的 Y 轴都完全相同，变的只是颜色。","w(a) = 1 / (1 + e^(−(a − %B%) / 10))   (a = 静止天数)\nLTH = Σ w(a) · 数量,   STH = Σ (1 − w(a)) · 数量"],["白线：ETH 价格","ETH 自身的价格，按日收盘价绘制。它用的是另一套隐藏坐标：这里的左右方向是时间而不是价格，范围是一年：从所选日期之前 275 天到之后 90 天（接近最新一天时，窗口止于最新一天之后一周，起点相应提前）；高度按线性刻度从 0 美元到迄今显示过的最高收盘价，所以这条线填满图表，同样的美元涨跌始终是同样的高度。只有价格创新高时，这个刻度才会扩大。橙色圆点标出所选当天，历史上的周期顶部与底部也已标注。拖动圆点即可在历史中移动。点击图例中的 ETH/USD 可以隐藏这条线。"],["悬停查看柱子","把鼠标停在柱子上，可以看到它的价格、该币龄层（长/短期模式下为该持有者群体）在那里的数量、整根柱子的占比及其对应的数量（最后移动时的总价值；% ETH 模式下为总供应量），以及占总量百分比。最后这一项是累计占比：当天全部供应（% USD 模式下为全部价值）中，最后一次在该价格或更低价格移动的部分。它按记录的价格本身计算，而不是按平滑后的柱子，因此在虚线处与方框中的盈利占比一致。相邻柱子之间它上升得越快，那里的供应越密集。","Percent of Total(P) = Σ W(p ≤ P) / Σ W × 100"],["标记价格区间","在图表上按住并横向拖动，即可标记一段价格区间。拖过的整列会以两条白色细线为界一直保持标记，切换日期和模式时也不会消失，直到你双击图表或按 Esc 键。标记内顶端、与标记同宽的方框给出当天最后在此区间内移动的占比（标记太窄、放不下文字时只显示占比）：% USD 模式下按价值，% ETH 模式下按币数，与“占总量百分比”一样按记录的价格计算，并按柱子的着色方式拆分这一占比（各部分同样以当天总量为基准，相加即为该占比）：年龄模式下按币龄层，各用其币龄层的颜色；长/短期模式下拆分为长期与短期持有者。方框太高时改用简短写法，再不行则只显示区间及其占比。在长/短期模式下，它还给出此处所有币都越过分界（至少一半算作长期持有）最多还需多少天及对应的日期：即其中最年轻的币最后一次移动后的第 %B% 天，每枚币的币龄都精确到天。若此处所有币都已越过分界，则显示“已全部越过长期持有者分界”。","Share(a, b) = Σ W(a ≤ P < b) / Σ W × 100\nAll past the boundary within = %B% − [a, b) 中最年轻的币的币龄"],["虚线：当天价格","所选当天的现价。它左边的供应最后一次移动时的价格低于此价格，因此处于盈利；右边的高于此价格，处于亏损。方框中给出价格以及这两个比例。这里的盈亏以最后一次移动时的价格为基准，只有当那次移动是一次买入时，它才是买入价（见“这张图不能告诉你什么”）。","Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"],["大家在看什么","密集成团的柱子代表大量供应沉淀在那个价位。若它位于今天价格之上，常被解读为上方阻力，理由是当初在那里移动过币的持有者可能在回本附近卖出；若位于下方，同一团柱子则被解读为支撑。宽阔的空档意味着这一段几乎没有供应去减缓价格穿越。这些都应当视为供应分布的地图，而不是价格走向的预测。"],["这张图不能告诉你什么","链上的一次移动并不等于一次成交。交易所在自己的账户之间调拨 ETH，用户在自己的钱包之间转移，合约把它传递出去（兑换、跨链桥、存入），这些都会以那一刻的价格重新打上标记，却没有买方也没有卖方。质押到信标链的 ETH 和其他余额一样只计算一次：存入的 ETH 带着存入那一刻的价格，提款先取走最早质押的部分，并在发放那天作为新的批次到账，信标链的奖励则在获得那天作为新的批次计入（数额是让质押的 ETH 达到当天供应量所需的部分，供应量取自 Coin Metrics）。因此每一天的柱子加起来都等于 ETH 的供应量。在交易所内部撮合的成交根本不上链，买卖双方身上的旧标记原封不动；私钥丢失的 ETH 则会永远保留它的标记。请把一根柱子读作“供应最后一次在此移动”，而不是“有人以此价成交”。"],["在历史中移动","这张图可以逐日回溯整段历史，一直回到以太坊 2015 年 7 月 30 日上线那天。1D/1W/1M/1Y 设定步长，箭头按钮移动一步，键盘上的左右方向键或 A/D 同样可用。1 到 4 选择步长，上下方向键或 W/S 把步长加大或减小一级（1D、1W、1M、1Y 循环）；Home/End 跳到最早与最新一天。你也可以从“周期顶部/底部”中选择某个周期顶部或底部，按日收盘价计：每个顶部都是历史最高收盘价，过去的每个顶部之后都下跌了 70% 或更多，最后一个是迄今为止的最高收盘价；每个底部是下一个新高之前的最低收盘价。无论走到哪里，左轴都停在当天自己的柱子上（见“Y 轴上限”），除非你固定了它（见“固定 Y 轴”）。若按键失灵，在图表上点一下，把焦点从工具栏输入框移开即可。"],["% USD 与 % ETH","% ETH 按币的数量计量。% USD 按它最后一次移动那一刻的美元价值计量，因此在 4,000 美元处最后移动的 1 ETH，远重于在 40 美元处移动的 1 ETH。% ETH 显示币在哪里，% USD 显示钱投在哪里。无论哪种，每根柱子都画成它占当天总量的比例：% ETH 下占全部币数，% USD 下占已实现市值。每一天的柱子加起来都是 100%，所以左轴在任何一天含义相同，悬停时会给出每个占比对应的数量。","S(P) = Σ lot.amount where lot.price ∈ [P, P + ΔP)\nValue When Last Moved(P) = P · S(P)\nShare(P) = W(P) / Σ W × 100   (W = S in % ETH, P · S in % USD)"],["固定 Y 轴 (PIN Y-AXIS)","左轴随每一天自己的柱子变化，所以移动时刻度会变。“固定 Y 轴”把它锁定在你正在看的这一天的位置，并用虚线标出，之后其他日期都按这一高度（在任何一天都是当天同样的占比）绘制，更高的柱子会冲出顶部（▲），而不会改变刻度。固定期间“Y 轴上限”输入框不可用，因为轴的终点由固定值决定。再按一次即可解除。固定值按加权方式、分箱数和平滑度分别保存（年龄与长/短期共用，因为两者的柱子相同），因为只有在相同设置下柱高才具有相同含义；刷新页面后依然保留。"],["分箱","“分箱”设定价格轴被切成多少根等宽的柱子，从 50 到 1000；默认 625，与视频相同。它们从 0 一直到价格轴的终点，即比迄今最高日收盘价高 0.1% 处（见“坐标轴怎么读”），另有一根在它之外，接住平滑越过这个终点的部分（更远的部分会按比例折回，供应量一点不少）。取 625 时，无论平滑度多少，每根柱子都恰好是价格轴的 1/625。“分箱”框在数字后面显示所看那天的这个宽度（美元）。分箱越少，柱子越宽，每根装得越多；越多则细节越细。只有轴扩大或你改变分箱时，柱宽才会改变。柱子对齐到整像素，相邻之间留出一像素间隙以便区分；当柱宽不足两像素时则实心绘制。","ΔP = price-axis end / bins   (end = 1.001 × highest close so far)"],["平滑 (Smoothing)","每枚币带着它最后一次移动那一刻的价格，即它那一天从开盘到收盘的直线上的价格（见“为什么每枚币都带着一个价格”）。重建记录每枚币在当天的什么时候移动，精确到 45 分钟；每一天被切成尽量少的几段，使每段内 ETH 的价格变动不超过价格的 0.5%，最多 32 段；每段的币均匀地分布在那段时间价格走过的区间上。然后平滑用钟形曲线把它们模糊开。这条曲线是高斯曲线，唯一不会凭空制造峰或缺口的模糊方式；它的宽度是价格的一个百分比，默认 0.24（与视频相同），且不小于约十分之四根柱宽，每根柱子精确地分得属于自己的那一份。设为 0 则显示原始分箱，每段的币按价格区间分给它覆盖的柱子。总供应量与总价值完全保持不变。","σ = √((S% × price)² + ΔP²/6)   (S = 0: raw)\nbar = the part of N(price, σ) inside the bar"],["Y 轴上限 (Y-max)","左轴的终点，按当天柱高的百分位计：100 时当天最高的柱子顶到图表顶部；低于 100 时轴停在该百分位，高出的柱子冲出顶部。左上角的 ▲ 数字给出其中最高那根的高度，括号里是另外还有几根，所以任何柱子被截断你都看得见。% USD 模式默认 100，% ETH 模式默认 99.8，否则通常最高的第一根柱子会决定整个刻度（见“坐标轴怎么读”）；每种模式都会记住你输入的值。固定 Y 轴期间此输入框不可用。","y-max = percentileₙ(this day's bars)   (100 = the tallest bar)"],["底部信号","当天处于亏损的占比达到工具栏中设定的阈值时，虚线和价格方框的边框会变成黄色，方框中还会多出第四行，写明所达到的阈值。% USD 模式下按在高于当天价格时最后移动的价值计算，默认 90%；% ETH 模式下按币数计算，默认 70%。每种模式都会记住你输入的值。它描述的是当天的状态，不是预测。","Signal when In Loss % ≥ Threshold"],["观看视频","工具栏中的“完整历史视频”会打开一个菜单，内有“视频 (% USD-长/短期)”“视频 (% USD-年龄)”“视频 (% ETH-长/短期)”和“视频 (% ETH-年龄)”四项，各在 YouTube 上打开一段整段历史的视频，按本页该选择的默认设置绘制（包括底部信号），柱子按短期与长期持有者（长/短期）或按币龄层（年龄）着色：时长 5 分钟，每秒 60 帧，4K（3840 × 2160），相邻日期平滑过渡。它们只绘制一次，截至制作那天；之后的日子请在本页逐日查看。在 YouTube 允许其他人观看某段视频之前，菜单中的这一项会打开频道。本站不提供任何文件下载（图表上的相机图标只是把图表存成一张 PNG 图片，由你自己的浏览器生成），也从不要求你安装软件、连接钱包或输入助记词；凡是这样做的，都不是本站。"],["数据来源","余额来自 ethPandaOps Xatu 的免费公开数据（第一个区块以来的每一次余额变化、区块与追踪记录，以及信标链的提款），逐个区块重建，并在重建过程中逐一核对：每一次变化都必须从迄今重建的余额出发，精确到 wei；所有余额之和必须等于已发行量减去已燃烧和已销毁的数量。数据有缺口之处，由公开的以太坊节点补齐。价格为 Coin Metrics 的日收盘价，每一天之内以直线相连；信标链奖励的数额由 Coin Metrics 的供应量决定（见“这张图不能告诉你什么”）。"]]},ja:{title:"このチャートの読み方",sections:[["まずはここから","いま存在するすべてのイーサに同じ質問をします。「最後に動いたとき、ETH はいくらでしたか」。その答えを価格帯ごとにまとめ、各帯の供給量を合計したものがこのチャートです。棒が高い価格帯は、多くの供給が最後に持ち主を変えた場所。空白の価格帯は、ほとんど動かなかった場所です。正式には URPD（実現価格分布）と呼ばれます。"],["アカウントとロット","イーサリアムは残高をアカウントに記録し、コインを一枚ずつ分けて持つ仕組みではありません。すべての ETH に価格を持たせるため、ここでは各アカウントの残高をロットの積み重ねとして扱います。残高が増えるたびに一つのロットとなり、届いたブロック、つまり届いた時刻の刻印が付きます（同じブロック内の複数回の増加は一つのロット）。残高が減るときは古いロットから先に使います（先入れ先出し）。使われずに残ったロットの残りは元の刻印を保ちます。その ETH は動いていないからです。このチャートの棒はすべてこのロットを積み上げたもので、最初のブロック以来のすべての残高変化から再構築しています。"],["すべてのコインが価格を持つ理由","ロットには ETH が届いた時刻の刻印があり、その時刻には価格がありました。ここでの価格の出所である Coin Metrics は一日に一つの価格、終値しか出していないため、一日の中では価格がその日の始値（前日の終値）から終値まで直線で動いたとみなし、今日存在するすべての ETH には、最後に動いた時刻のその直線上の価格が刻まれています。この価格がその ETH の実現価格、別名コストベーシスで、「現在の保有者がいくら払ったか」にオンチェーンで最も近い値です。ジェネシス配分（約 7,200 万 ETH。2014 年のプレセールと初期貢献者の取り分）は、初日に市場価格がなかったため 0 ドルとし、最後に動いたのが 2015 年 8 月 8 日（日足終値がある最初の日）より前の ETH も 0 ドルとしています。その日に最後に動いた ETH はその日の終値です。"],["軸の読み方","横軸はいま説明した「コインに刻まれた価格」（ドル）で、今日の価格ではありません。縦軸は各価格帯がその日の全体に占める割合（%）です。% USD モードでは実現時価総額（各コインが最後に動いたときの価値の合計）に対する割合、% ETH モードではすべてのコインに対する割合です。どの日も棒の合計は 100% になるので、同じ高さはどの日でも同じ割合を表します。どちらの軸も 0 から端までを 20 等分して目盛りを付け、ラベルは有効数字 2 桁に丸めています。価格軸は日ごとに合わせ直すことはしません。表示中の日までにデータが到達した最高価格で止まり、データがそこを越えたときだけ広がり、決して縮みません。左軸はその日の最も高い棒で止まるので、毎日の分布が同じ枠いっぱいに描かれます。これを変えられるのは「Y軸上限」の入力欄と「Y 軸を固定」ボタンだけです（「Y軸上限」「Y 軸を固定」を参照）。% ETH モードでは Y軸上限の既定は 99.8 です。最初の棒には、最後に動いた価格が棒 1 本分の幅に満たないコインがすべて入っており、ジェネシス配分のうちいまも動いていない 0 ドルの部分も含まれるため、たいてい最も高い棒になります。99.8 では最も高い棒が上端を突き抜け、その高さを上端に ▲ で表示します。100 と入力すれば全体が見えます。"],["色：コインの古さ","「年齢」では、どの棒も 23 段階の年齢帯を積み重ねたものです。基準はそのコインが動かずにいた期間で、片端は 1 時間未満、もう片端は 15 年超。黄色が新しく、濃い青が古く、その間は対数で刻まれているため、同じ色の隔たりは同じ年齢の倍率にあたります。色は知覚的に均等な色空間（OKLCH）の一本の経路に沿って並び、どの段差も同じ大きさに見えるよう配置され、明るさは新しいものから古いものへ一様に下がるので、グレースケールでも順序が読み取れます。どの帯も暗い背景に対して 3:1 以上のコントラストを保ちます。単色の高い棒は単一の層、色とりどりの高い棒は世代の異なる保有者が重なっている価格です。"],["長期/短期か年齢か","2 組目の切り替えで、棒の色分けを選びます。既定の「長期/短期」は、すべてのコインをそれぞれの年齢で、イーサリアム自身の長期保有者の境界 %B% 日を基準に分けます。この境界は Glassnode の手法でイーサリアム自身の履歴から求めたものです。各年齢について、その年齢のロットが次の 7・14・30・60・90・120 日以内に使われる確率を計算します。この確率はコインが古くなるほど、初めは急に、やがて緩やかに下がります。境界は、1 年目のうちでこの確率が 1 年超のコインのどの時点よりも速く下がっている最後の年齢です（6 つの期間の中央値）。一律に切るのではなく、コインが長期保有とみなされる割合は境界の前後でなめらかに上がります。Glassnode の幅 10 日のロジスティック重みで、%B% 日動いていなければ半分、その約 22 日後には 90% です。琥珀色の短期保有者（STH）と青の長期保有者（LTH）を合わせると供給全体になります。「年齢」は棒を 23 の年齢帯そのもので積み上げます。どちらを選んでも棒、軸、固定した Y 軸は同じで、変わるのは色だけです。","w(a) = 1 / (1 + e^(−(a − %B%) / 10))   (a = 動いていない日数)\nLTH = Σ w(a) · 量,   STH = Σ (1 − w(a)) · 量"],["白い線：ETH 価格","ETH 自身の価格を日足終値で描いたものです。この線だけは別の（非表示の）軸を使っており、左右方向は価格ではなく時間で、選択日の 275 日前から 90 日後までの 1 年間を表します（最新日に近いときは、最新日の 1 週間後で終わり、その分だけ前から始まります）。高さは 0 ドルからそれまでに表示された最高終値までの線形目盛りなので、線はチャートいっぱいに広がり、同じドル幅の値動きは常に同じ高さになります。この目盛りが広がるのは価格が高値を更新したときだけです。オレンジの点が選択日で、過去のサイクル天井と大底も示してあります。点をドラッグすれば履歴をたどれます。凡例の ETH/USD をクリックすると線を隠せます。"],["棒にカーソルを合わせる","棒にカーソルを合わせると、その価格、その年齢帯（長期/短期では保有者グループ）がそこに持つ量、棒全体の割合とその量（最終移動時の評価額の合計。% ETH モードでは供給量の合計）、そして全体に占める割合が表示されます。最後の値は累計の割合で、その日の供給全体（% USD モードでは価値全体）のうち、その価格以下で最後に動いた部分です。平滑化した棒ではなく記録された価格そのものから数えるので、破線の位置ではボックスの含み益の割合と一致します。棒から棒へ急に増えるところは供給が密集しています。","Percent of Total(P) = Σ W(p ≤ P) / Σ W × 100"],["価格の範囲に印を付ける","チャート上でクリックしたまま横にドラッグすると、価格の範囲に印を付けられます。なぞった列は 2 本の白い細線に挟まれて印が付いたまま残り、日付やモードを切り替えても、チャートをダブルクリックするか Esc キーを押すまで消えません。印の内側の上端にある、印と同じ幅のボックスには（印が狭くて文字が入らないときは割合だけ）、その日のうちこの範囲で最後に動いた割合（% USD モードでは評価額、% ETH モードではコインの量）が、「全体に占める割合」と同じく記録された価格から数えて表示され、その割合を棒の色分けどおりに分けた値（どれもその日の全体に対する割合で、足すと元の割合になります）も表示されます。年齢では年齢帯ごとにその帯の色で、長期/短期では長期保有者と短期保有者に分けます。ボックスが高くなりすぎるときは短い表記に、それでも収まらなければ範囲とその割合だけにします。長期/短期では、ここにあるコインがすべて境界を越える（少なくとも半分が長期保有になる）までの最大日数とその日付も表示します。最も若いコインが最後に動いてから %B% 日後で、どのコインの年齢も日単位で分かっています。すべてのコインがすでに境界を越えていれば「すでにすべて長期保有者の境界を越えています」と表示します。","Share(a, b) = Σ W(a ≤ P < b) / Σ W × 100\nAll past the boundary within = %B% − [a, b) で最も若いコインの年齢"],["破線：その日の価格","選択した日の現在値です。その左側の供給はこの価格より安く最後に動いたので含み益、右側は高く動いたので含み損です。ボックスに価格と両方の割合が出ます。ここでの損益は最後に動いたときの価格が基準で、その移動が購入だった場合にだけ購入価格と一致します（「このチャートで分からないこと」を参照）。","Profit % = Σ W(P) for P ≤ Spot / Σ W(P) × 100"],["何を読み取るのか","棒が厚く固まっている価格は、多くの供給が滞留した場所です。今日の価格より上にあれば、そこで最後に動かした保有者が損益分岐付近で売るかもしれない、という理由から上値抵抗と読まれることが多く、下にあれば同じ塊が支持と読まれます。広い空白は、値動きを鈍らせる供給が乏しい区間です。いずれも供給の分布図であって、価格の予測ではありません。"],["このチャートで分からないこと","オンチェーンの移動が必ず売買とは限りません。取引所が自社のアカウント間で ETH を動かし、利用者が自分のウォレット間で移し、コントラクトがそれを受け渡す（スワップ、ブリッジ、預け入れ）。そのたびに ETH はその時刻の価格で刻み直されますが、買い手も売り手もいません。ビーコンチェーンにステーキングされた ETH は、ほかの残高と同じく一度だけ数えます。預け入れた ETH は預けた時刻の価格のまま残り、引き出しは最も古いステーキング分から順に取り出されて、支払われた日に新しいロットとして届きます。ビーコンチェーンの報酬は、得られた日の新しいロットです（その日の供給量にステーキング分を合わせる額で、供給量は Coin Metrics によります）。そのため、毎日の棒の合計は ETH の供給量に一致します。取引所の内部で約定した取引はチェーンに触れないため双方とも古い刻印のままで、鍵を失った ETH は永遠にその刻印を保ちます。棒は「供給が最後にここで動いた」ことを示すもので、「誰かがこの値段で買った」証拠ではありません。"],["履歴をたどる","このチャートは、2015 年 7 月 30 日のイーサリアムの開始まで一日ずつさかのぼれます。1D/1W/1M/1Y が刻み幅、矢印ボタンが 1 刻みの移動で、キーボードの左右または A/D でも同じ操作ができます。1〜4 で刻み幅を選び、上下または W/S で刻み幅を一段ずつ上げ下げし（1D・1W・1M・1Y を循環）、Home/End で最初と最後の日へ飛びます。天井/大底からサイクルの天井・大底を選ぶこともできます。日足終値によるもので、各天井は最高終値です。過去の天井はいずれもその後 70% 以上下落し、最後の天井はこれまでの最高終値です。各大底は次の最高値までの最安終値です。どこへ移動しても、左軸はその日の棒に合わせて決まります（「Y軸上限」を参照）。固定している場合は別です（「Y 軸を固定」を参照）。キーが効かなくなったら、チャートを一度クリックしてツールバーの入力欄からフォーカスを外してください。"],["% USD と % ETH","% ETH はコインをイーサの量で数えます。% USD は最後に動いた時点のドル価値で数えるため、4,000 ドルで最後に動いた 1 ETH は、40 ドルで動いた 1 ETH よりはるかに重くなります。% ETH はコインの在処を、% USD は資金の入った場所を示します。どちらでも、各棒はその日の全体に占める割合として描かれます。% ETH ではすべてのコインに対して、% USD では実現時価総額に対してです。どの日も棒の合計は 100% になるので、左軸はどの日でも同じ意味を持ち、カーソルを合わせると各割合の元になる量が表示されます。","S(P) = Σ lot.amount where lot.price ∈ [P, P + ΔP)\nValue When Last Moved(P) = P · S(P)\nShare(P) = W(P) / Σ W × 100   (W = S in % ETH, P · S in % USD)"],["Y 軸を固定 (PIN Y-AXIS)","左軸はその日の棒に合わせて決まるので、移動すると目盛りが変わります。「Y 軸を固定」は、表示中の日の位置で左軸を固定し、破線で示します。以後どの日もその高さ（どの日でもその日の同じ割合）を基準に描かれ、それより高い棒は軸を動かさずに上端を突き抜けます（▲）。固定中は軸の上端を固定値が決めるので、「Y軸上限」の入力欄は使えません。もう一度押せば解除されます。固定値は重み付け、ビン数、スムージングごとに別々に保存されます（年齢と長期/短期は棒が同じなので共通です）。高さが同じ意味を持つのは設定が同じときだけだからです。再読み込みしても残ります。"],["ビン数","「ビン数」は、価格軸を何本の等幅の棒に区切るかを決めます。50〜1000 で、既定は動画と同じ 625 です。棒は 0 から価格軸の端（それまでの最高終値の 0.1% 先）まで並び（「軸の読み方」を参照）、その先にもう 1 本あって、スムージングがその価格を越えて広げた分を受け止めます（さらに先へ届く分は比例して戻すので、供給は失われません）。625 のとき、棒 1 本はスムージングにかかわらず、価格軸のちょうど 1/625 です。表示中の日のこの幅は、「ビン数」欄の数の後ろにドルで出ます。ビン数を減らすと棒は太くなり 1 本あたりの量が増え、増やすと細部が細かくなります。棒の幅が変わるのは軸が広がったときか、ビン数を変えたときだけです。棒はピクセル単位に揃え、隣とは 1 ピクセル空けて描き分けますが、幅が 2 ピクセルを切る場合は塗りつぶしで描きます。","ΔP = price-axis end / bins   (end = 1.001 × highest close so far)"],["スムージング (Smoothing)","どのコインにも、最後に動いた時刻の価格、つまりその日の始値から終値への直線上の価格が刻まれています（「すべてのコインが価格を持つ理由」を参照）。再構築では各コインがその日のいつ動いたかを 45 分単位で記録し、一日を、各区間の中での ETH の値動きが価格の 0.5% 以内に収まる最も少ない数（最大 32）の区間に分けて、各区間のコインをその時間に価格が通った範囲に均等に広げます。スムージングはそれをさらにベル型の曲線でぼかします。これはガウス曲線で、山や谷を新たに作り出さない唯一のぼかし方です。幅は価格に対する割合で、既定は動画と同じ 0.24、棒の幅のおよそ 10 分の 4 を下回らず、各棒には自分の取り分が正確に配分されます。0 にすると生のビンになり、各区間のコインはその価格範囲がかかる棒に分けられます。総供給量と総額は厳密に保たれます。","σ = √((S% × price)² + ΔP²/6)   (S = 0: raw)\nbar = the part of N(price, σ) inside the bar"],["Y軸上限 (Y-max)","左軸の上端を、その日の棒の高さのパーセンタイルで決めます。100 ではその日の最も高い棒が上端に届き、100 未満では軸がそのパーセンタイルで止まり、それより高い棒は上端を突き抜けます。左上の ▲ の数字がそのうち最も高い棒の高さを示し、括弧内はほかに何本あるかを示すので、棒が知らないうちに切り取られることはありません。既定は % USD モードで 100、% ETH モードで 99.8 です。ETH では、たいてい最も高い最初の棒が目盛りを決めてしまうためです（「軸の読み方」を参照）。入力した値はモードごとに保たれます。Y 軸を固定している間は、この欄は使えません。","y-max = percentileₙ(this day's bars)   (100 = the tallest bar)"],["ボトムシグナル","その日の含み損の割合がツールバーで設定したしきい値に達すると、破線と価格ボックスの枠が黄色に変わり、ボックスに達したしきい値を示す 4 行目が加わります。% USD モードではその日の価格より高く最後に動いた評価額の割合で既定は 90%、% ETH モードではコインの量の割合で既定は 70% です。入力した値はモードごとに保たれます。その日の状態を示すもので、予測ではありません。","Signal when In Loss % ≥ Threshold"],["動画を見る","ツールバーの「全期間の動画」を押すと開くメニューの「動画 (% USD-長期/短期)」「動画 (% USD-年齢)」「動画 (% ETH-長期/短期)」「動画 (% ETH-年齢)」で、全期間を 1 本にまとめた動画をそれぞれ YouTube で見られます。本ページのその選択の既定どおり（ボトムシグナルを含む）に描かれ、棒を短期保有者と長期保有者（長期/短期）または年齢帯（年齢）で色分けし、隣り合う日をなめらかにつなぎ、5 分・毎秒 60 フレーム・4K（3840 × 2160）です。動画は作成した日までを一度だけ描いたもので、その後の日はこのページでたどってください。YouTube で動画を他の人が見られるようになるまでは、メニューのその項目はチャンネルを開きます。このサイトはファイルのダウンロードを提供しません（チャート上のカメラアイコンは、チャートを PNG 画像として保存するだけで、画像はお使いのブラウザーの中で作られます）。ソフトのインストール、ウォレットの接続、シードフレーズの入力を求めることもありません。そうするものは、このサイトではありません。"],["データの出所","残高は ethPandaOps Xatu の無料公開データ（最初のブロック以来のすべての残高変化、ブロックとトレース、そしてビーコンチェーンの引き出し）から、ブロックごとに再構築し、その都度検算しています。すべての変化は、それまでに再構築した残高から wei 単位で一致して始まらなければならず、全残高の合計は、発行量から焼却量と消滅量を引いた値と一致しなければなりません。データに欠けがある箇所は、公開のイーサリアムノードで補っています。価格は Coin Metrics の日足終値を一日の中で直線で結んだもので、ビーコンチェーンの報酬の額は Coin Metrics の供給量で決まります（「このチャートで分からないこと」を参照）。"]]}};function updateExplainerLang(){var e=EXPLAINER[lang]||EXPLAINER.en,t=document.getElementById("explainTitle"
