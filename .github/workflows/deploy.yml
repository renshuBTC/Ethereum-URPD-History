name: Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Check the page
        run: |
          node tools/update-csp.cjs --check
          if [ -d tests ]; then node --test tests/*.test.cjs; fi
      - name: Fetch the day snapshots
        run: |
          name=$(awk 'NR == 1 { sub(/^\*/, "", $2); print $2 }' data/days.sha256)
          case "$name" in days-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].bin) ;; *) echo "::error::data/days.sha256 names no day file"; exit 1 ;; esac
          git fetch -q --depth=1 origin day-file
          for p in $(git ls-tree --name-only FETCH_HEAD | grep -E "^$name\.part-[0-9]{2}$" | sort); do git cat-file blob "FETCH_HEAD:$p"; done > "$RUNNER_TEMP/$name"
          (cd "$RUNNER_TEMP" && sha256sum --strict -c "$GITHUB_WORKSPACE/data/days.sha256")
          mv "$RUNNER_TEMP/$name" "$RUNNER_TEMP/days.bin"
      - name: Build
        run: node build/build-site.mjs --days "$RUNNER_TEMP/days.bin" --holders data/holders.json --out dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
